name: Release

# Every push to master ships a release. Documentation-only pushes do not, and
# any commit whose message contains [skip release] is left alone.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# electron-builder uploads the installer and latest.yml to a GitHub release.
permissions:
  contents: write

# Two releases building at once would both bump the version and race to push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    # The NSIS installer needs a real Windows toolchain.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # npm version needs the history to make a commit on top of master,
          # and the tag it creates has to be pushable.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-updater compares semver, so an unchanged version is invisible
      # to installed clients no matter what the release is called. Nothing is
      # committed yet — a build that fails below must leave master untouched.
      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      # Typecheck and bundle. Doing this before anything is pushed means a
      # broken commit costs a red run and nothing else: no orphan tag, no
      # version number burnt, and the next push retries the same number.
      - name: Build
        run: npm run build

      # Pushes authenticated with GITHUB_TOKEN cannot trigger workflows, so the
      # bump commit cannot start a second release run.
      - name: Commit and tag the release
        # Windows runners default to PowerShell; this block is bash.
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v${VERSION} [skip release]"
          git tag "v${VERSION}"
          git push --follow-tags origin HEAD:master

      # Uploads the installer, its blockmap and latest.yml to the release.
      - name: Publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
